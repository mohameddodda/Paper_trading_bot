# Paper Trading Bot Pro Config – Updated for 2024
# WARNING: This is for PAPER TRADING SIMULATIONS ONLY.
# Do not use for real financial transactions, live trading, or any illegal activities.
# All settings are defaults; override via environment variables or code.

# === TRADING MODE (Toggle for flexibility) ===
stock_mode: false  # Set to true for stocks (yfinance), false for crypto
crypto_mode: true  # Automatically toggles based on stock_mode

# === SIMULATION SETTINGS ===
update_interval: 10  # seconds between market checks (matches bot.py)
initial_balance: 1000000.0  # Virtual starting cash ($1M)

# === SYMBOLS ===
# Stock symbols (used if stock_mode: true)
stock_symbols:
  - AAPL
  - GOOGL
  - MSFT
  - TSLA
# Crypto symbols (used if crypto_mode: true, e.g., for Crypto.com API)
crypto_symbols:
  - BTC_USDT
  - ETH_USDT
  - SOL_USDT
  - DOGE_USDT
  - SHIB_USDT
  - CRO_USDT
  - XRP_USDT
  - ADA_USDT
# Active symbols (auto-selected based on mode)
symbols: crypto_symbols  # Will be overridden in code based on mode

# === AI & SIGNAL SETTINGS ===
ai_model: deepseek/deepseek-chat  # Matches bot.py
use_ai: true  # Enable AI features (disable if no API key)
ai_temperature: 0.3
ai_max_tokens: 300

# === RISK & TRADING LOGIC ===
cooldown: 300  # Seconds between buys per symbol (prevents over-trading)
max_risk_pct: 0.03  # Max % of balance per trade
stop_loss_pct: -0.05  # Sell if price drops 5% (negative for loss)
take_profit_pct: 0.10  # Sell if price rises 10%
volatility_threshold: 0.02  # % price move to trigger AI re-evaluation

# === BACKTESTING ===
backtest_days: 90
aggregate_size: "1"
aggregate_unit: "minute"

# === LOGGING & OUTPUT ===
log_level: INFO
log_dir: bot_logs  # Folder for logs (relative to project root)
csv_log_file: trades.csv
performance_chart: performance.png
report_file: performance_report.html  # QuantStats HTML report

# === ADVANCED FEATURES ===
cloud_enabled: false  # Enable for AWS/Docker deployment
use_rl: false  # Reinforcement learning toggle
rl_training: false
debug_mode: false
mock_ai: false  # Test without API calls

# === PLATFORM SPECIFICS ===
voice_alerts: true  # iOS speech alerts
push_notifications: true  # iOS notifications
keychain_service: PaperTradingBot  # iOS key storage