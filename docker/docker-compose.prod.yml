version: '3.8'

x-shared: &shared
  restart: unless-stopped

services:
  bot:
    <<: *shared
    build: .
    container_name: paper-trading-bot-prod
    volumes:
      - db_data:/app/paper_trading.db
      - ./config:/app/config:ro
      - ./checkpoints:/app/checkpoints:ro
    ports:
      - "8501:8501"  # Streamlit GUI if gui_bot
    environment:
      - PYTHONPATH=/app
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import core.db_manager; print(\"DB healthy\")' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  postgres:
    <<: *shared
    image: postgres:16-alpine
    container_name: paper-trading-postgres-prod
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: paper_trading
      POSTGRES_USER: ${POSTGRES_USER:-bot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-supersecret}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bot} -d paper_trading"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    <<: *shared
    image: redis:7-alpine
    container_name: paper-trading-redis-prod
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s

  prometheus:
    <<: *shared
    image: prom/prometheus
    container_name: paper-trading-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    <<: *shared
    image: grafana/grafana
    container_name: paper-trading-grafana
    volumes:
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    ports:
      - "3000:3000"

volumes:
  db_data:
  postgres_data:

